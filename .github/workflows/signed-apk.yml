name: Signed APK

# Signed release APK (arm64, with cloud providers incl. Telegram). Manual only: run it from the Actions tab.
# After the build it publishes a GitHub Release with the APK attached (turn off with the "release" input).
# Needs these repository secrets: SIGNING_KEY (base64 of the .jks), ALIAS, KEY_PASSWORD, KEY_STORE_PASSWORD.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release with the APK after the build"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: signed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check signing secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Signing secrets are missing. Add SIGNING_KEY, ALIAS, KEY_PASSWORD and KEY_STORE_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell || true
      - name: Fix permissions
        run: chmod +x ./gradlew
      - name: Tune Gradle for CI
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties
      - name: Install pinned SDK CMake (native scripts require 3.31.6)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6" >/dev/null
      - name: Decode Keystore
        uses: timheuer/base64-to-file@v1
        with:
          fileName: 'release_key.jks'
          fileDir: 'app/androidApp/'
          encodedString: ${{ secrets.SIGNING_KEY }}
      - name: Build signed release APK
        run: ./gradlew --build-cache :app:androidApp:assembleArm64-v8aNoMLRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      - uses: actions/upload-artifact@v5
        with:
          name: refra-signed-arm64
          path: app/androidApp/build/outputs/apk-renamed/**/*.apk
      - name: Publish GitHub Release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/androidApp/build/outputs/apk-renamed -name '*.apk' | head -n 1)
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" "$APK" \
            --target "${{ github.sha }}" \
            --title "ReFra build ${{ github.run_number }}" \
            --notes "Signed arm64 build from commit ${{ github.sha }}"
